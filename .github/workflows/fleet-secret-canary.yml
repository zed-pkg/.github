name: Fleet secret and SOPS canary

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/fleet-secret-canary.yml'
  push:
    branches:
      - agent/fleet-secret-canary

permissions:
  contents: read
  actions: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Verify direct secret, SOPS ciphertext, and managed symlink
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
          EXPECTED_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          test -n "${SOPS_AGE_KEY:-}"
          gh api --silent repos/zed-pkg/zed-clients
          can_push="$(gh api repos/zed-pkg/zed-clients --jq '.permissions.push // false')"
          [[ "$can_push" == true ]]

          mkdir -p env/dec
          nix develop --command ores-sops use --force prod
          test -L .env
          test "$(readlink .env)" = 'env/dec/prod.env'
          test "$(stat -c '%a' env/dec)" = '700'
          test "$(stat -c '%a' env/dec/prod.env)" = '600'

          actual_token="$(awk -F= '$1 == "ZED_FLEET_GH_TOKEN" { print substr($0, index($0, "=") + 1) }' .env)"
          [[ -n "$actual_token" && "$actual_token" == "$EXPECTED_TOKEN" ]]
          ORES_SOPS_VERIFY_DECRYPT=1 nix develop --command ores-sops verify
          nix develop --command ores-sops lock
          test ! -e .env
          test ! -e env/dec/prod.env
          echo 'Direct Actions secret and SOPS ciphertext are synchronized.' >> "$GITHUB_STEP_SUMMARY"

      - name: Verify setup-python trusts the runner-managed CA chain
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from tools.discover_clients_fleet import GitHub

          organizations = GitHub(os.environ["GITHUB_TOKEN"]).organizations()
          assert organizations, "the fleet credential returned no organizations"
          assert any(value.casefold() == "zed-pkg" for value in organizations)
          print(f"verified GitHub API TLS against {len(organizations)} accessible organizations")
          PY
          echo 'Python GitHub discovery completed with normal certificate and hostname verification.' >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch full clients-fleet dry run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run nightly-clients-fleet-hardening.yml \
            --repo zed-pkg/.github \
            --ref main \
            -f apply=false
          echo 'Dispatched nightly clients-fleet workflow with apply=false.' >> "$GITHUB_STEP_SUMMARY"
