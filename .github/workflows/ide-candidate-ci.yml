name: IDE candidate conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/ide-insight-contract.md"
      - "docs/ide-parity-matrix.json"
      - "tools/validate_ide_matrix.py"
      - "blueprints/zed-eclipse/**"
      - "blueprints/zed-xcode/**"
      - "blueprints/zed-visual-studio/**"
      - "blueprints/zed-qtcreator/**"
      - "blueprints/zed-vscode/**"
      - ".github/workflows/ide-candidate-ci.yml"
  push:
    branches: [main]
    paths:
      - "docs/ide-insight-contract.md"
      - "docs/ide-parity-matrix.json"
      - "tools/validate_ide_matrix.py"
      - "blueprints/zed-eclipse/**"
      - "blueprints/zed-xcode/**"
      - "blueprints/zed-visual-studio/**"
      - "blueprints/zed-qtcreator/**"
      - "blueprints/zed-vscode/**"
      - ".github/workflows/ide-candidate-ci.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - run: python tools/validate_ide_matrix.py docs/ide-parity-matrix.json

  eclipse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --file blueprints/zed-eclipse/pom.xml test

  xcode:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: swift test --package-path blueprints/zed-xcode

  visual-studio:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test blueprints/zed-visual-studio/Zed.VisualStudio.sln --configuration Release

  qtcreator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: cmake -S blueprints/zed-qtcreator -B /tmp/zed-qtcreator -DBUILD_TESTING=ON
      - run: cmake --build /tmp/zed-qtcreator --parallel 2
      - run: ctest --test-dir /tmp/zed-qtcreator --output-on-failure

  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Run candidate tests
        working-directory: blueprints/zed-vscode
        run: npm test
      - name: Package VSIX
        working-directory: blueprints/zed-vscode
        run: npx --yes @vscode/vsce package --out /tmp/zed-package-insights.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zed-vscode-candidate-vsix
          path: /tmp/zed-package-insights.vsix
          if-no-files-found: error
