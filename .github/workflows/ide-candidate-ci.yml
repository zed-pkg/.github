name: IDE candidate conformance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/ide-insight-contract.md"
      - "docs/ide-parity-matrix.json"
      - "tools/validate_ide_matrix.py"
      - "blueprints/zed-eclipse/**"
      - "blueprints/zed-xcode/**"
      - "blueprints/zed-visual-studio/**"
      - "blueprints/zed-qtcreator/**"
      - "bootstrap/zed-vscode-20260805.bundle.b64.part-*"
      - ".github/workflows/ide-candidate-ci.yml"
  push:
    branches: [main]
    paths:
      - "docs/ide-insight-contract.md"
      - "docs/ide-parity-matrix.json"
      - "tools/validate_ide_matrix.py"
      - "blueprints/zed-eclipse/**"
      - "blueprints/zed-xcode/**"
      - "blueprints/zed-visual-studio/**"
      - "blueprints/zed-qtcreator/**"
      - "bootstrap/zed-vscode-20260805.bundle.b64.part-*"
      - ".github/workflows/ide-candidate-ci.yml"

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python tools/validate_ide_matrix.py docs/ide-parity-matrix.json

  eclipse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode --file blueprints/zed-eclipse/pom.xml test

  xcode:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: swift test --package-path blueprints/zed-xcode

  visual-studio:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet test blueprints/zed-visual-studio/Zed.VisualStudio.sln --configuration Release

  qtcreator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cmake -S blueprints/zed-qtcreator -B /tmp/zed-qtcreator -DBUILD_TESTING=ON
      - run: cmake --build /tmp/zed-qtcreator --parallel 2
      - run: ctest --test-dir /tmp/zed-qtcreator --output-on-failure

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore verified candidate
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/zed-vscode-20260805.bundle.b64.part-* | base64 --decode > /tmp/zed-vscode.bundle
          printf '%s  %s\n' 'a0d927aa62ab20922e85ee2de9592d0a9fd4bafebf6a5b00a0029a95914c2991' /tmp/zed-vscode.bundle | sha256sum --check --strict
          git bundle verify /tmp/zed-vscode.bundle
          git clone /tmp/zed-vscode.bundle /tmp/zed-vscode
          git -C /tmp/zed-vscode checkout 7fe04d03d5c16c45381aff23eec4e8c6c441ec31
      - name: Install, test, and package candidate
        working-directory: /tmp/zed-vscode
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint --if-present
          npm run compile --if-present
          npm test --if-present
          npx --yes @vscode/vsce package --out /tmp/zed-package-insights.vsix
          test -s /tmp/zed-package-insights.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: zed-vscode-candidate-vsix
          path: /tmp/zed-package-insights.vsix
          if-no-files-found: error
