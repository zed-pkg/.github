name: Run corrected Zed fleet audit now 2026-09-02

on:
  push:
    branches:
      - automation/run-now-20260902
    paths:
      - .github/workflows/run-now-20260902.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: run-now-20260902-corrected-audit
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the corrected organization-only audit on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ORGS: opto-sync,fiducia-cloud,3FA-app,elenkos-systems,fanwaave,quaestor-ledger,ores-otel,shared-auth,zed-pkg,messaging-intel,gha-indie-worker,canonical-cloud,claritas-viz,sonus-auris,voxletra,memebank,anticaptrad,daedalus-fab,declarative-migrations,usa-acc,channelsiege,akrion-sim,scintilla-run,sagitta-stack
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/zed-fleet-audit.yml/dispatches" \
            -f ref=main \
            -f "inputs[orgs]=${TARGET_ORGS}"
          echo 'Dispatched the corrected read-only Zed fleet audit on main.' >> "$GITHUB_STEP_SUMMARY"

      - name: Record the new audit run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 12
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=workflow_dispatch&per_page=10" \
            --jq '.workflow_runs[] | select(.name == "Zed fleet audit") | "Zed fleet audit run \(.id): status=\(.status), conclusion=\(.conclusion // \"pending\"), head=\(.head_sha)"' \
            >> "$GITHUB_STEP_SUMMARY"
