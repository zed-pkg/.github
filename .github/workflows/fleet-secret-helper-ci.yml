name: Fleet secret helper CI

on:
  pull_request:
    paths:
      - tools/set-zed-fleet-secret.sh
      - tools/test_set_zed_fleet_secret.py
      - justfile
      - docs/fleet-secret-management.md
      - .github/workflows/fleet-secret-helper-ci.yml
  push:
    branches:
      - main
    paths:
      - tools/set-zed-fleet-secret.sh
      - tools/test_set_zed_fleet_secret.py
      - justfile
      - docs/fleet-secret-management.md
      - .github/workflows/fleet-secret-helper-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-secret-helper-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Validate shell syntax
        run: bash -n tools/set-zed-fleet-secret.sh
      - name: Run keyless helper tests
        run: python -m unittest -v tools/test_set_zed_fleet_secret.py
