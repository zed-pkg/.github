name: Bootstrap nightly clients fleet hardening

on:
  pull_request:
    paths:
      - '.bootstrap/clients-fleet.tar.gz.b64.*'
      - '.bootstrap/final-SHA256SUMS'
      - '.github/workflows/bootstrap-nightly-clients-fleet.yml'

permissions:
  contents: write

concurrency:
  group: bootstrap-nightly-clients-fleet-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Materialize, verify, and test reviewed source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/clients-fleet.tar.gz.b64.* | base64 --decode > /tmp/clients-fleet.tar.gz
          echo '4364a562940293e913be0d6da8622d9f43bb0c05b82b1f1a97d0903304eedebb  /tmp/clients-fleet.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/clients-fleet.tar.gz -C .
          sha256sum --check --strict .bootstrap/final-SHA256SUMS
          python -m py_compile tools/discover_clients_fleet.py tools/run_clients_batch.py tools/test_discover_clients_fleet.py tools/test_run_clients_batch.py
          python -m unittest -v tools/test_discover_clients_fleet.py tools/test_run_clients_batch.py
          bash -n tools/audit_harden_client.sh
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          import yaml
          from pathlib import Path
          class Loader(yaml.SafeLoader):
              pass
          for key, resolvers in list(Loader.yaml_implicit_resolvers.items()):
              Loader.yaml_implicit_resolvers[key] = [
                  (tag, regex) for tag, regex in resolvers
                  if tag != 'tag:yaml.org,2002:bool'
              ]
          value = yaml.load(Path('.github/workflows/nightly-clients-fleet-hardening.yml').read_text(), Loader=Loader)
          assert set(value['on']) == {'schedule', 'workflow_dispatch'}
          assert set(value['jobs']) == {'gate', 'discover', 'canonical-toolchain', 'harden', 'report'}
          PY
      - name: Replace bootstrap payload with readable source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm .github/workflows/bootstrap-nightly-clients-fleet.yml
          git config user.name 'zed-pkg automation'
          git config user.email 'zed-pkg-automation@users.noreply.github.com'
          git add -A
          git commit -m 'feat: schedule nightly clients fleet hardening'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
