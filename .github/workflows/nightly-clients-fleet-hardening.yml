name: Nightly clients fleet hardening

on:
  schedule:
    # GitHub cron is UTC. Run both offsets and gate on America/Chicago = 03:00,
    # which remains correct across CST/CDT transitions.
    - cron: '0 8 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      orgs:
        description: Optional comma-separated organization override
        required: false
        type: string
      apply:
        description: Push/update hardening pull requests and failure issues
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read
  actions: read

concurrency:
  group: nightly-clients-fleet-hardening
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.clock.outputs.should_run }}
    steps:
      - id: clock
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" != schedule ]]; then
            echo 'should_run=true' >>"$GITHUB_OUTPUT"
            exit 0
          fi
          local_hour="$(TZ=America/Chicago date +%H)"
          if [[ "$local_hour" == 03 ]]; then
            echo 'should_run=true' >>"$GITHUB_OUTPUT"
          else
            echo "Skipping duplicate UTC trigger; America/Chicago hour is $local_hour"
            echo 'should_run=false' >>"$GITHUB_OUTPUT"
          fi

  preflight:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify cross-organization credential before fan-out
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
          ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
          APPLY_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.apply == 'true' }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo '::error title=Nightly clients fleet is not configured::ZED_FLEET_GH_TOKEN is missing.'
            exit 78
          }
          gh api --silent repos/zed-pkg/zed-clients
          if [[ "$APPLY_REQUESTED" == true ]]; then
            can_push="$(gh api repos/zed-pkg/zed-clients --jq '.permissions.push // false')"
            [[ "$can_push" == true ]] || {
              echo '::error title=Nightly clients token is read-only::Scheduled/apply runs require push access for bounded hardening PRs.'
              exit 77
            }
          fi
          if [[ -z "${ZED_PKG_TOKEN:-}" ]]; then
            echo '::warning title=Zed registry token is not configured::Private or unpublished registry dependencies may fail resolution; set ZED_PKG_TOKEN with a zpkg_ token minted by zed-api-server.'
            echo '- Zed registry token: **not configured; format resolution remains fail-closed**' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Zed registry token: **configured**' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Cross-organization credential canary passed before discovery/toolchain fan-out.' >> "$GITHUB_STEP_SUMMARY"

  discover:
    needs: [gate, preflight]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      batch_matrix: ${{ steps.matrix.outputs.batch_matrix }}
      count: ${{ steps.matrix.outputs.count }}
      batch_count: ${{ steps.matrix.outputs.batch_count }}
    env:
      GITHUB_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
      ORG_OVERRIDE: ${{ inputs.orgs || vars.ZED_FLEET_ORGS || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Test fleet controller
        run: >-
          python -m unittest -v
          tools/test_audit_harden_client.py
          tools/test_discover_clients_fleet.py
          tools/test_run_clients_batch.py
      - id: matrix
        name: Discover clients, paired test orgs, and Zed consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/discovery
          python tools/discover_clients_fleet.py \
            --orgs "$ORG_OVERRIDE" \
            --output reports/discovery/fleet.json \
            --matrix-output reports/discovery/matrix.json \
            --batch-matrix-output reports/discovery/batch-matrix.json \
            --batch-size 4 \
            --markdown reports/discovery/summary.md
          matrix="$(tr -d '\n' < reports/discovery/matrix.json)"
          batch_matrix="$(tr -d '\n' < reports/discovery/batch-matrix.json)"
          count="$(python -c 'import json; print(len(json.load(open("reports/discovery/matrix.json"))["include"]))')"
          batch_count="$(python -c 'import json; print(len(json.load(open("reports/discovery/batch-matrix.json"))["include"]))')"
          {
            echo "matrix=$matrix"
            echo "batch_matrix=$batch_matrix"
            echo "count=$count"
            echo "batch_count=$batch_count"
          } >>"$GITHUB_OUTPUT"
          cat reports/discovery/summary.md >>"$GITHUB_STEP_SUMMARY"
      - name: Upload discovery report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clients-fleet-discovery
          path: reports/discovery
          if-no-files-found: error
          retention-days: 30

  canonical-toolchain:
    needs: [gate, preflight]
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      format_result: ${{ steps.format_status.outputs.result }}
    env:
      GITHUB_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
      ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-clients
          ref: main
          path: canonical
          token: ${{ secrets.ZED_FLEET_GH_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-cli
          ref: main
          path: zed-cli
          token: ${{ secrets.ZED_FLEET_GH_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: zed-pkg/zed-api-server.rs
          ref: main
          path: zed-api
          token: ${{ secrets.ZED_FLEET_GH_TOKEN }}
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Verify canonical schema and generator
        run: |
          python -m pip install --disable-pip-version-check tomlkit jsonschema
          python -m py_compile canonical/scripts/harden_client_contract.py
          python -m unittest -v canonical/tests/test_harden_client_contract.py
      - name: Stage exact canonical interface contract
        shell: bash
        run: |
          set -euo pipefail
          interfaces_sha="$(python - <<'PY'
          import re
          from pathlib import Path

          lines = Path("canonical/.github/workflows/nix.yml").read_text(encoding="utf-8").splitlines()
          for index, line in enumerate(lines):
              if re.fullmatch(r"\s*repository:\s*zed-pkg/zed-interfaces\s*(?:#.*)?", line) is None:
                  continue
              for candidate in lines[index + 1:index + 9]:
                  match = re.fullmatch(r"\s*ref:\s*['\"]?([0-9a-f]{40})['\"]?\s*(?:#.*)?", candidate)
                  if match is not None:
                      print(match.group(1))
                      raise SystemExit(0)
          raise SystemExit("canonical zed-clients workflow has no immutable zed-interfaces pin")
          PY
          )"
          git init zed-interfaces-source
          git -C zed-interfaces-source fetch --depth=1 \
            https://github.com/zed-pkg/zed-interfaces.git "$interfaces_sha"
          resolved_sha="$(git -C zed-interfaces-source rev-parse FETCH_HEAD)"
          [[ "$resolved_sha" == "$interfaces_sha" ]]
          git -C zed-interfaces-source archive --format=tar FETCH_HEAD | gzip -n >zed-interfaces.tar.gz
          tar -tzf zed-interfaces.tar.gz >zed-interfaces-archive.txt
          grep -Fx 'src/rust/Cargo.toml' zed-interfaces-archive.txt
          printf '%s\n' "$interfaces_sha" >zed-interfaces.sha
      - name: Build Zed CLI from current tip
        run: cargo build --locked --release --manifest-path zed-cli/Cargo.toml
      - name: Resolve current-tip CLI package lock
        id: cli_resolve
        continue-on-error: true
        working-directory: zed-cli
        shell: bash
        env:
          ZED_HOME: ${{ runner.temp }}/zed-cli-package-home
        run: |
          set -euo pipefail
          ./target/release/zed \
            --registry https://registry.zpkg.net \
            --home "$ZED_HOME" \
            install \
            --install-mode copy
          if ! git diff --quiet -- .zpkg.lock; then
            echo '::notice title=Current-tip CLI lock drift::The resolver updated zed-cli/.zpkg.lock; an apply run will open or refresh its bounded lock PR.'
          fi
      - name: Check Zed API server from current tip
        working-directory: zed-api
        run: cargo check --locked --all-targets
      - name: Resolve canonical package lock with current-tip CLI
        id: canonical_resolve
        continue-on-error: true
        working-directory: canonical
        shell: bash
        env:
          ZED_HOME: ${{ runner.temp }}/zed-clients-canonical-home
        run: |
          set -euo pipefail
          ../zed-cli/target/release/zed \
            --registry https://registry.zpkg.net \
            --home "$ZED_HOME" \
            install \
            --install-mode copy
          if ! git diff --quiet -- .zpkg.lock; then
            echo '::notice title=Canonical Zed lock drift::The current-tip resolver updated .zpkg.lock; the fleet hardener will include it in the bounded client PR.'
          fi
      - name: Validate canonical CLI/API package formats
        id: format_validate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          status=0
          (cd zed-cli && ./target/release/zed validate --require-lock --json) || status=1
          (cd canonical && ../zed-cli/target/release/zed validate --require-lock --json) || status=1
          (cd zed-api && ../zed-cli/target/release/zed validate --json) || status=1
          exit "$status"
      - name: Record current-tip package-format result
        id: format_status
        if: always()
        shell: bash
        env:
          CLI_RESOLVE: ${{ steps.cli_resolve.outcome }}
          CANONICAL_RESOLVE: ${{ steps.canonical_resolve.outcome }}
          FORMAT_VALIDATE: ${{ steps.format_validate.outcome }}
        run: |
          set -euo pipefail
          result=success
          for value in "$CLI_RESOLVE" "$CANONICAL_RESOLVE" "$FORMAT_VALIDATE"; do
            [[ "$value" == success ]] || result=failure
          done
          echo "result=$result" >>"$GITHUB_OUTPUT"
          {
            echo '## Current-tip Zed package formats'
            echo
            echo "- zed-cli resolution: **$CLI_RESOLVE**"
            echo "- zed-clients resolution: **$CANONICAL_RESOLVE**"
            echo "- CLI/client/API validation: **$FORMAT_VALIDATE**"
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Assemble immutable run toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p toolchain
          cp zed-cli/target/release/zed toolchain/zed
          cp canonical/scripts/harden_client_contract.py toolchain/harden_client_contract.py
          cp canonical/schemas/client-api.schema.json toolchain/client-api.schema.json
          cp zed-interfaces.tar.gz toolchain/zed-interfaces.tar.gz
          python - <<'PY'
          import json, pathlib, subprocess
          def sha(path):
              return subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()
          value = {
              "schemaVersion": 1,
              "zedClients": sha("canonical"),
              "zedCli": sha("zed-cli"),
              "zedApiServer": sha("zed-api"),
              "zedInterfaces": pathlib.Path("zed-interfaces.sha").read_text(encoding="utf-8").strip(),
          }
          open("toolchain/tips.json", "w", encoding="utf-8").write(json.dumps(value, indent=2, sort_keys=True) + "\n")
          PY
          sha256sum toolchain/* > toolchain/SHA256SUMS
          sha256sum --check toolchain/SHA256SUMS
      - name: Upload canonical run toolchain
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: zed-clients-canonical-toolchain
          path: toolchain
          if-no-files-found: error
          retention-days: 7
      - name: Open or refresh current-tip CLI lock pull request
        if: steps.cli_resolve.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.apply == 'true')
        working-directory: zed-cli
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .zpkg.lock; then
            exit 0
          fi
          branch='automation/nightly-zed-lock'
          git config user.name 'zed-pkg automation'
          git config user.email 'zed-pkg-automation@users.noreply.github.com'
          gh auth setup-git
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git checkout -B "$branch"
          git add .zpkg.lock
          git commit -m 'chore: refresh current-tip zed package lock'
          git push --force-with-lease origin "HEAD:$branch"
          body_file="$RUNNER_TEMP/zed-cli-lock-pr.md"
          cat >"$body_file" <<'EOF'
          The nightly clients fleet controller regenerated `.zpkg.lock` with the current `zed-cli` resolver and validated it with `zed validate --require-lock --json`.

          This branch is stable and is refreshed only when current-tip package resolution changes the committed lock.
          EOF
          pr_number="$(gh pr list --repo zed-pkg/zed-cli --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --repo zed-pkg/zed-cli \
              --title 'chore: refresh current-tip zed package lock' \
              --body-file "$body_file"
          else
            gh pr create --repo zed-pkg/zed-cli --base main --head "$branch" \
              --title 'chore: refresh current-tip zed package lock' \
              --body-file "$body_file"
          fi

  harden:
    needs:
      - gate
      - discover
      - canonical-toolchain
    if: needs.gate.outputs.should_run == 'true' && needs.discover.outputs.count != '0'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.batch_matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GITHUB_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
      GH_TOKEN: ${{ secrets.ZED_FLEET_GH_TOKEN }}
      ZED_PKG_TOKEN: ${{ secrets.ZED_PKG_TOKEN }}
      APPLY: ${{ github.event_name != 'workflow_dispatch' || inputs.apply == 'true' }}
      CLIENTS_JSON: ${{ toJSON(matrix.clients) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: zed-clients-canonical-toolchain
          path: toolchain
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install hardener and batch-runner dependencies
        run: |
          python -m pip install --disable-pip-version-check tomlkit jsonschema pytest
          npm install --global typescript@5.7.3
      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Configure authenticated cross-organization Git
        run: gh auth setup-git
      - name: Audit batch, harden clients, and test current-tip consumers
        shell: bash
        env:
          NIXPKGS_ALLOW_UNFREE: '1'
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown
          mkdir -p "reports/batch-${{ matrix.batch_id }}"
          nix flake metadata --json nixpkgs >"reports/batch-${{ matrix.batch_id }}/nixpkgs-metadata.json"
          packages=(
            nixpkgs#zig
            nixpkgs#gleam
            nixpkgs#beamPackages.erlang
            nixpkgs#beamPackages.elixir
            nixpkgs#rebar3
            nixpkgs#dart
            nixpkgs#deno
            nixpkgs#bun
            nixpkgs#gradle
            nixpkgs#phpPackages.composer
            nixpkgs#wasm-pack
          )
          if ! command -v swift >/dev/null 2>&1; then
            packages+=(nixpkgs#swift)
          fi
          nix shell --impure --accept-flake-config "${packages[@]}" \
            --command python tools/run_clients_batch.py
      - name: Upload batch reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: client-hardening-batch-${{ matrix.batch_id }}
          path: reports
          if-no-files-found: warn
          retention-days: 30

  report:
    needs:
      - gate
      - preflight
      - discover
      - canonical-toolchain
      - harden
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: 'client-hardening-batch-*'
          path: reports
          merge-multiple: true
      - name: Publish fleet summary
        shell: bash
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          HARDEN_RESULT: ${{ needs.harden.result }}
          DISCOVERY_COUNT: ${{ needs.discover.outputs.count }}
          BATCH_COUNT: ${{ needs.discover.outputs.batch_count }}
          DISCOVERY_RESULT: ${{ needs.discover.result }}
          TOOLCHAIN_RESULT: ${{ needs.canonical-toolchain.result }}
          FORMAT_RESULT: ${{ needs.canonical-toolchain.outputs.format_result }}
        run: |
          set -euo pipefail
          {
            echo '# Nightly clients fleet hardening'
            echo
            echo "- protected preflight result: **${PREFLIGHT_RESULT:-not-run}**"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "${PREFLIGHT_RESULT:-failure}" != success ]]; then
            echo '- fan-out: **blocked before discovery and canonical toolchain execution**' >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "- discovered client repositories: **${DISCOVERY_COUNT:-0}**"
            echo "- bounded runner batches: **${BATCH_COUNT:-0}**"
            echo "- discovery result: **${DISCOVERY_RESULT:-not-run}**"
            echo "- canonical toolchain result: **${TOOLCHAIN_RESULT:-not-run}**"
            echo "- current-tip package formats: **${FORMAT_RESULT:-not-run}**"
            echo "- hardening matrix result: **${HARDEN_RESULT:-not-run}**"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ -d reports ]]; then
            while IFS= read -r summary; do
              {
                echo
                cat "$summary"
              } >>"$GITHUB_STEP_SUMMARY"
            done < <(find reports -name summary.md -type f | sort)
          fi
          [[ "${DISCOVERY_RESULT:-failure}" == success ]]
          [[ "${TOOLCHAIN_RESULT:-failure}" == success ]]
          [[ "${FORMAT_RESULT:-failure}" == success ]]
          [[ "${HARDEN_RESULT:-failure}" == success ]]
