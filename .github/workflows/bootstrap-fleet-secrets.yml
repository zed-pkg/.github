name: Bootstrap fleet Actions and SOPS secrets

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-fleet-secrets.yml'
      - '.bootstrap/bootstrap-fleet-secrets.sh.gz.b64.*'
      - '.gitignore'
      - '.env.example'
      - 'flake.nix'
      - 'justfile'
      - 'docs/fleet-secret-management.md'

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: bootstrap-fleet-secrets-${{ github.event.pul_request.number }}
  cancel-in-progress: false

jobs:
  provision:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
          persist-credentials: true
          show-progress: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Materialize and run the one-time encrypted bootstrap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cat .bootstrap/bootstrap-fleet-secrets.sh.gz.b64.* \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/bootstrap-fleet-secrets.sh
          echo 'eb4d950a27a704a9135fdca063ec1de4aa6c70c0264cc22bbe38ad39ef1195e4  /tmp/bootstrap-fleet-secrets.sh' | sha256sum --check --strict
          chmod 0700 /tmp/bootstrap-fleet-secrets.sh
          /tmp/bootstrap-fleet-secrets.sh
